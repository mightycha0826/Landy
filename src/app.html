<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1e1e1e" media="(prefers-color-scheme: dark)" />
		<!-- 이 앱은 다크 모드를 스스로 그린다 (Phase 43) — 안드로이드 Chrome 의 "사이트에 어두운 테마 적용" · 삼성 인터넷 다크 모드가
		     화면을 억지로 뒤집지 않게, 아이폰 키보드 · 스크롤 막대도 어두운 화면이면 어둡게. 고른 모드가 있으면 아래 스크립트가 바꾼다 (app.css 와 같이) -->
		<meta name="color-scheme" content="light dark" />
		<!-- 설정 > 화면에서 고른 모드 · 글자 크기 · 움직임 · 편지지 글씨를 첫 화면 전에 입힌다 (번쩍임 방지)
		     — lib/theme.svelte.ts · lib/prefs.svelte.ts 와 같은 키 -->
		<script nonce="%sveltekit.nonce%">
			(function () {
				try {
					var d = document.documentElement.dataset;
					var t = localStorage.getItem('theme-v1');
					if (t === 'light' || t === 'dark') {
						d.theme = t;
						document.querySelector('meta[name="color-scheme"]').content = 'only ' + t;
					}
					var p = JSON.parse(localStorage.getItem('prefs-v1') || '{}') || {};
					if (/^(sm|lg|xl)$/.test(p.text)) d.text = p.text;
					if (p.motion === true) d.motion = 'reduce';
					if (p.letterFont === 'plain') d.letterFont = 'plain';
				} catch (e) {}
			})();
		</script>
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/icon-192.png" />
		<!-- 삼성 인터넷 (Phase 43) — 삼성 인터넷이 만드는 설치 앱은 Android 14+ 의 Play 프로텍트가 "위험한 앱"으로 막는다 (lib/platform.ts needsChrome).
		     삼성 인터넷에는 설치 정보(manifest)를 주지 않는다 — 주소창의 "앱 설치" 단추가 뜨지 않게 (홈 화면에 추가해도 브라우저 탭으로 열려
		     설치 안내 화면으로 온다). 그 화면이 Chrome 으로 넘긴다 (routes/install) -->
		<script nonce="%sveltekit.nonce%">
			(function () {
				if (/SamsungBrowser/.test(navigator.userAgent)) return;
				var l = document.createElement('link');
				l.rel = 'manifest';
				l.href = '/manifest.webmanifest';
				document.head.appendChild(l);
			})();
		</script>
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<!-- 아이폰 상태바 (Phase 43-2) — default: 화면이 상태바 아래에서 시작하고, 상태바는 theme-color(라이트 #fbf9f7 · 다크 #0c0a0b)에
		     맞춰 글자색이 바뀐다 (라이트면 검은 글씨). 예전 black-translucent 는 글씨가 늘 흰색이라 라이트 모드에서 시계가 안 보였다.
		     이 값은 홈 화면에 추가할 때 저장되므로, 예전에 추가한 앱은 app.css 의 상태바 바탕이 대신 받쳐 준다 -->
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Landy" />
		<title>Landy</title>
		<!-- 링크 미리보기 (카카오톡 · 메시지 · 인스타 DM) — 학생 앱은 SSR 을 끄므로(+layout.ts) 수집기가 읽는 건 이 파일뿐.
		     og:image 는 절대 주소여야 해서 도메인을 적는다 (도메인을 바꾸면 여기도) -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Landy" />
		<meta property="og:title" content="Landy · 우리 학교에서 시작하는 대화" />
		<meta property="og:description" content="충남삼성고 학생을 위한 익명 대화 앱. 학교 이메일로 인증하는 익명 대화와 편지." />
		<meta property="og:url" content="https://landychat.com/" />
		<!-- og.jpg = 인스타 연결 표지(docs/marketing/instagram/renewal-2026-10-31/Covers-Connected-Preview.png)를 폭 1200 으로 줄이고 위아래를 배경색으로 채운 것 -->
		<meta property="og:image" content="https://landychat.com/og.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div id="app">%sveltekit.body%</div>
	</body>
</html>
